<!DOCTYPE html>
<html>
<head>
    <title>Using Hyperlinks in HTML</title>
</head>
<body>

    <h2>Hyperlink Examples</h2>

    <!-- Internal Link -->
    <p>
        <a href="about.html">About Page</a>
    </p>

    <!-- External Link -->
    <p>
        <a href="https://www.wikipedia.org" target="_blank">
            Visit Wikipedia
        </a>
    </p>

    <!-- Email Link -->
    <p>
        <a href="mailto:info@example.com">Email Us</a>
    </p>

</body>
</html>
