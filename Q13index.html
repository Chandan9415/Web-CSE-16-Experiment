<!DOCTYPE html>
<html>
<head>
    <title>Quotation & Citation Elements</title>
</head>
<body>

    <h2>Text Related Elements</h2>

    <!-- Inline quotation -->
    <p>
        According to experts, <q>HTML is the backbone of the web</q>.
    </p>

    <!-- Block quotation -->
    <blockquote cite="https://www.w3.org">
        HTML defines the structure of web pages.
    </blockquote>

    <!-- Citation -->
    <p>
        <cite>– W3C</cite>
    </p>

    <!-- Abbreviation -->
    <p>
        <abbr title="World Wide Web Consortium">W3C</abbr> sets web standards.
    </p>

    <!-- Address -->
    <address>
        Written by Chandan<br>
        Visit us at: www.example.com<br>
        Email: info@example.com
    </address>

</body>
</html>
